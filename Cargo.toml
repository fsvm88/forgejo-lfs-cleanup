[package]
name = "forgejo-lfs-cleanup"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Deletes Git LFS objects unreachable from any ref in a Forgejo repository"
license = "MIT"
readme = "README.md"
keywords = ["forgejo", "git-lfs", "git", "cleanup"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive", "env"] }
reqwest = { version = "0.13.4", features = ["blocking", "cookies", "form", "json"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27.0"
url = "2.5.8"
